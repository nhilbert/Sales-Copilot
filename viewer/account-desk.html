<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- No network access of any kind: everything is inline, data comes only from the folder you open. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
<title>Account Desk Viewer</title>
<style>
:root{
  --bg:#f6f6f4; --panel:#ffffff; --ink:#1d1f21; --muted:#5f6368; --line:#e2e2de; --soft:#efefeb;
  --accent:#2f5d8a; --accent-soft:#e6eef6;
  --good:#2e7d4f; --good-soft:#e3f2e8; --warn:#9a6700; --warn-soft:#fbf0d9; --bad:#b3261e; --bad-soft:#fbe6e4;
  --chip:#f1f1ee; --shadow:0 1px 2px rgba(0,0,0,.06);
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#16181b; --panel:#1f2226; --ink:#e7e7e4; --muted:#a3a7ad; --line:#33373c; --soft:#272a2f;
    --accent:#8fb6dd; --accent-soft:#24344a;
    --good:#7cc79a; --good-soft:#1f3529; --warn:#e2b75a; --warn-soft:#3a3020; --bad:#f08a80; --bad-soft:#3f2422;
    --chip:#2a2d32; --shadow:none;
  }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans)}
button,select,input{font:inherit;color:inherit}
a{color:var(--accent)}
.app{display:grid;grid-template-columns:250px 1fr;grid-template-rows:auto 1fr;height:100vh}
header{grid-column:1/-1;display:flex;gap:12px;align-items:center;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{font-size:15px;margin:0 8px 0 0;font-weight:650;letter-spacing:.01em}
header .spacer{flex:1}
header label{color:var(--muted);font-size:12px;display:flex;align-items:center;gap:6px}
.btn{border:1px solid var(--line);background:var(--panel);padding:6px 12px;border-radius:7px;cursor:pointer}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
@media (prefers-color-scheme: dark){.btn.primary{color:#0e1620}}
input[type=date],select,input[type=search]{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:5px 8px}
input[type=search]{min-width:200px}
nav{background:var(--panel);border-right:1px solid var(--line);overflow:auto;padding:12px 0}
nav h2{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:14px 16px 6px;font-weight:600}
nav button{display:block;width:100%;text-align:left;border:0;background:none;padding:7px 16px;cursor:pointer;border-left:3px solid transparent}
nav button:hover{background:var(--soft)}
nav button.active{border-left-color:var(--accent);background:var(--accent-soft)}
nav .sub{display:block;color:var(--muted);font-size:12px}
main{overflow:auto;padding:20px 24px 60px}
.banner{background:var(--warn-soft);color:var(--warn);border:1px solid var(--line);padding:6px 12px;border-radius:7px;margin-bottom:12px;font-size:13px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:14px 0 18px;flex-wrap:wrap}
.tabs button{border:0;background:none;padding:8px 12px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.active{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
h2.title{margin:0;font-size:20px;font-weight:650}
.subtitle{color:var(--muted);margin-top:2px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;box-shadow:var(--shadow)}
.card h3{margin:0 0 10px;font-size:13px;font-weight:650;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.stat .v{font-size:22px;font-weight:650}
.stat .l{color:var(--muted);font-size:12px}
.stat.warn .v{color:var(--warn)} .stat.bad .v{color:var(--bad)} .stat.good .v{color:var(--good)}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;background:var(--chip);color:var(--muted);white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.acc{background:var(--accent-soft);color:var(--accent)}
.idl{font-family:var(--mono);font-size:12px;color:var(--accent);cursor:pointer;text-decoration:none;border-bottom:1px dotted var(--accent)}
.idl.missing{color:var(--muted);border-bottom-color:var(--muted);cursor:default}
.muted{color:var(--muted)} .small{font-size:12px} .mono{font-family:var(--mono);font-size:12px}
ul.plain{list-style:none;margin:0;padding:0}
ul.plain li{padding:6px 0;border-bottom:1px solid var(--soft)}
ul.plain li:last-child{border-bottom:0}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--soft);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600;position:sticky;top:0;background:var(--panel)}
tr.click{cursor:pointer} tr.click:hover td{background:var(--soft)}
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.chipbar{display:flex;gap:6px;flex-wrap:wrap}
.chipbar button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:2px 10px;font-size:12px;cursor:pointer}
.chipbar button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
/* stakeholder map */
.smap{display:grid;grid-template-columns:90px repeat(6,minmax(110px,1fr));gap:4px}
.smap .hd{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:4px;text-align:center}
.smap .rh{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;display:flex;align-items:center;justify-content:flex-end;padding-right:8px}
.smap .cell{background:var(--soft);border-radius:8px;min-height:70px;padding:5px;display:flex;flex-direction:column;gap:4px}
.person{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--muted);border-radius:6px;padding:4px 6px;cursor:pointer;font-size:12px;line-height:1.3}
.person.fresh{border-left-color:var(--good)} .person.stale{border-left-color:var(--warn)} .person.never{border-left-color:var(--bad)}
.person .r{color:var(--muted);font-size:11px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:8px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
/* timeline */
.tl-month{font-size:12px;font-weight:650;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:18px 0 6px}
.tl{border-left:2px solid var(--line);margin-left:6px;padding-left:14px}
.tl .e{position:relative;padding:6px 0}
.tl .e::before{content:"";position:absolute;left:-20px;top:12px;width:10px;height:10px;border-radius:50%;background:var(--panel);border:2px solid var(--accent)}
.tl .e.comm::before{background:var(--accent)}
.tl .meta{font-size:12px;color:var(--muted)}
/* drawer */
.drawer{position:fixed;top:0;right:0;width:min(520px,100vw);height:100vh;background:var(--panel);border-left:1px solid var(--line);box-shadow:-6px 0 18px rgba(0,0,0,.12);transform:translateX(105%);transition:transform .18s ease;z-index:10;display:flex;flex-direction:column}
.drawer.open{transform:none;visibility:visible}
.drawer:not(.open){visibility:hidden;transition:transform .18s ease,visibility 0s .18s}
.nowrap{white-space:nowrap}
.drawer .dh{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.drawer .db{overflow:auto;padding:14px 16px 40px}
dl.kv{display:grid;grid-template-columns:130px 1fr;gap:4px 12px;margin:0}
dl.kv dt{color:var(--muted);font-size:12px} dl.kv dd{margin:0}
/* markdown */
.md h1{font-size:19px;margin:0 0 8px} .md h2{font-size:16px;margin:18px 0 6px;border-bottom:1px solid var(--line);padding-bottom:4px} .md h3{font-size:14px;margin:14px 0 4px} .md h4{font-size:13px;margin:12px 0 4px}
.md pre{background:var(--soft);padding:10px;border-radius:7px;overflow:auto;font-family:var(--mono);font-size:12px}
.md code{font-family:var(--mono);font-size:12px;background:var(--soft);padding:0 4px;border-radius:4px}
.md table{margin:8px 0}
.md blockquote{border-left:3px solid var(--line);margin:8px 0;padding:2px 12px;color:var(--muted)}
.fm{font-size:12px;background:var(--soft);border-radius:7px;padding:8px 10px;margin-bottom:12px}
.empty{max-width:640px;margin:40px auto;text-align:left}
.empty h2{font-size:22px;margin:0 0 8px}
.empty ol{padding-left:20px}
.files{display:grid;grid-template-columns:260px 1fr;gap:14px}
.files ul{list-style:none;padding:0;margin:0}
.files li button{border:0;background:none;padding:4px 6px;cursor:pointer;text-align:left;width:100%;border-radius:5px;font-family:var(--mono);font-size:12px}
.files li button:hover,.files li button.active{background:var(--accent-soft)}
.bar{height:6px;border-radius:3px;background:var(--soft);overflow:hidden}
.bar>span{display:block;height:100%;background:var(--accent)}
@media (max-width:820px){
  .app{grid-template-columns:1fr;grid-template-rows:auto auto 1fr}
  nav{border-right:0;border-bottom:1px solid var(--line);max-height:180px}
  main{padding:16px}
  .files{grid-template-columns:1fr}
  .smap{grid-template-columns:70px repeat(6,minmax(80px,1fr));overflow:auto}
}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Account Desk</h1>
    <button class="btn primary" id="open">Open workspace folder</button>
    <button class="btn" id="reload" hidden>Reload</button>
    <input type="file" id="picker" webkitdirectory directory multiple hidden>
    <span class="muted small" id="srcinfo"></span>
    <span class="spacer"></span>
    <input type="search" id="q" placeholder="Search all records and logs">
    <label>Today <input type="date" id="today"></label>
    <label>Show <select id="vis">
      <option value="all">all entries</option>
      <option value="team">team + crm only</option>
      <option value="crm">crm only</option>
    </select></label>
  </header>
  <nav id="nav"></nav>
  <main id="main"></main>
</div>
<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="dh"><strong id="dtitle"></strong><span class="spacer" style="flex:1"></span><button class="btn" id="dclose">Close</button></div>
  <div class="db" id="dbody"></div>
</aside>

<script>
"use strict";
/* Account Desk Viewer — read-only explorer for a Sales Copilot workspace.
   Reads the folder you choose; never writes, never connects to the network. MIT licence. */
const SC = (() => {
  const S = {
    files: new Map(),        // path -> text
    names: [],               // all paths incl. unread (binary/large)
    accounts: [], shared: { vp: [], products: [], competitors: [] },
    today: new Date().toISOString().slice(0, 10),
    vis: "all", view: { kind: "home" }, tab: "overview", q: "", dir: null, rootName: "",
    tl: { files: new Set(), person: "" }, actFilter: "open", filePath: ""
  };
  const TEXT_EXT = /\.(md|txt|eml|csv|json|ya?ml)$/i;
  const ID_RE = /\b((?:AVP|DL|RM|[SGQADPN])-[A-Za-z0-9][A-Za-z0-9-]*|E-\d{6}-[a-z0-9-]+)\b/g;
  const LEASED = new Set(["A", "Q", "N", "DL"]);
  const EXEMPT = new Set(["done", "dropped", "parked", "answered", "acted", "closed"]);
  const STANCES = ["blocker", "sceptic", "neutral", "supporter", "champion", "unknown"];
  const INFL = ["high", "medium", "low", "unknown"];
  const $ = s => document.querySelector(s);

  /* ---------- DOM helper (always textContent, never raw HTML) ---------- */
  function h(tag, attrs, ...kids) {
    const el = document.createElement(tag);
    if (attrs) for (const [k, v] of Object.entries(attrs)) {
      if (v == null || v === false) continue;
      if (k === "class") el.className = v;
      else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? "" : v);
    }
    for (const k of kids.flat(Infinity)) {
      if (k == null || k === false) continue;
      el.append(k instanceof Node ? k : document.createTextNode(String(k)));
    }
    return el;
  }

  /* ---------- dates ---------- */
  const isDate = s => /^\d{4}-\d{2}-\d{2}$/.test(s || "");
  const days = (a, b) => Math.round((Date.parse(b) - Date.parse(a)) / 864e5);
  function ago(d) {
    if (!isDate(d)) return "unknown";
    const n = days(d, S.today);
    if (n === 0) return "today";
    return n > 0 ? `${n} d ago` : `in ${-n} d`;
  }
  function addDays(d, n) { const t = new Date(Date.parse(d) + n * 864e5); return t.toISOString().slice(0, 10); }

  /* ---------- parsing ---------- */
  function frontMatter(text) {
    if (!text.startsWith("---\n") && !text.startsWith("---\r\n")) return { fm: {}, body: text };
    const t = text.replace(/\r\n/g, "\n");
    const end = t.indexOf("\n---\n", 4);
    if (end < 0) return { fm: {}, body: t };
    const fm = {}; let lastKey = null;
    for (const raw of t.slice(4, end).split("\n")) {
      if (!raw.trim() || raw.trim().startsWith("#")) continue;
      const li = raw.match(/^\s+-\s+(.*)$/);
      if (li && lastKey) { if (!Array.isArray(fm[lastKey])) fm[lastKey] = []; fm[lastKey].push(unq(li[1])); continue; }
      const m = raw.match(/^([A-Za-z_][\w-]*):\s*(.*)$/);
      if (!m) continue;
      lastKey = m[1];
      let v = m[2].replace(/\s+#.*$/, "").trim();
      if (v.startsWith("[") && v.endsWith("]")) v = v.slice(1, -1).split(",").map(x => unq(x.trim())).filter(Boolean);
      else v = unq(v);
      fm[lastKey] = v === "" ? [] : v;
    }
    return { fm, body: t.slice(end + 5) };
  }
  const unq = s => s.replace(/^["']|["']$/g, "");

  function parseDoc(path, text) {
    const { fm, body } = frontMatter(text);
    const clean = body.replace(/<!--[\s\S]*?-->/g, "");
    const lines = clean.split("\n");
    const doc = { path, fm, title: "", sections: {}, records: [], subs: [], logs: [] };
    let sec = null, sub = null, rec = null;
    for (const line of lines) {
      if (/^# /.test(line) && !doc.title) { doc.title = line.slice(2).trim(); continue; }
      if (/^## /.test(line)) { sec = line.slice(3).trim(); doc.sections[sec] = []; sub = null; rec = null; continue; }
      if (!sec) continue;
      doc.sections[sec].push(line);
      if (/^### /.test(line)) {
        const m = line.match(/^### ((?:AVP|DL|RM|[SGQADPN])-[A-Za-z0-9-]+) · (.+)$/);
        if (m && sec === "Current") {
          rec = { id: m[1], type: m[1].split("-")[0], title: m[2].trim(), keys: {}, file: path, sub: sub && sub.name };
          doc.records.push(rec);
        } else { rec = null; sub = { name: line.slice(4).trim(), lines: [], sec }; doc.subs.push(sub); }
        continue;
      }
      if (rec) {
        const km = line.match(/^- ([a-z_]+): (.*)$/);
        if (km) { rec.keys[km[1]] = km[2].trim(); continue; }
        if (line.trim()) (rec.extra = rec.extra || []).push(line);
        continue;
      }
      if (sub) sub.lines.push(line);
      if (sec === "History") { const e = parseLog(line, path); if (e) doc.logs.push(e); }
    }
    return doc;
  }
  function parseLog(line, file) {
    const m = line.match(/^- (\d{4}-\d{2}-\d{2})( \(recorded\))? · (.*)$/);
    if (!m) return null;
    let rest = m[3], src = "", vis = "private";
    const t = rest.match(/\{src: ([^;{}]+); vis: (private|team|crm)\}\s*$/);
    if (t) { src = t[1].trim(); vis = t[2]; rest = rest.slice(0, t.index).trim(); }
    return { date: m[1], recorded: !!m[2], parts: rest.split(" · "), text: rest, src, vis, file };
  }

  /* ---------- model ---------- */
  function build() {
    const paths = [...S.files.keys()];
    const prefix = commonRoot(S.names);
    S.rootName = prefix.replace(/\/$/, "") || "workspace";
    const rel = p => p.slice(prefix.length);
    const byRel = new Map(paths.map(p => [rel(p), S.files.get(p)]));
    S.rel = byRel;
    S.relNames = S.names.map(rel);
    const slugs = [...new Set(S.relNames.map(p => (p.match(/^accounts\/([^/_.][^/]*)\/README\.md$/) || [])[1]).filter(Boolean))].sort();
    S.accounts = slugs.map(slug => buildAccount(slug, byRel));
    S.shared.vp = [...byRel].filter(([p]) => /^_shared\/value-propositions\/[^/]+\.md$/.test(p)).map(([p, t]) => ({ path: p, ...frontMatter(t), doc: parseDoc(p, t) }));
    S.shared.products = [...byRel].filter(([p]) => /^_shared\/products\/[^/]+\.md$/.test(p)).map(([p, t]) => ({ path: p, ...frontMatter(t) }));
    S.shared.competitors = [...byRel].filter(([p]) => /^_shared\/competitors\/[^/]+\.md$/.test(p)).map(([p, t]) => ({ path: p, ...frontMatter(t) }));
  }
  // The workspace root is the folder that contains accounts/ or _shared/.
  function commonRoot(names) {
    for (const n of names) { const m = n.match(/^(.*?\/)?(accounts|_shared)\//); if (m) return m[1] || ""; }
    return "";
  }
  function buildAccount(slug, byRel) {
    const dir = `accounts/${slug}/`;
    const docs = {};
    for (const [p, t] of byRel) {
      if (!p.startsWith(dir)) continue;
      const r = p.slice(dir.length);
      if (/^[^/]+\.md$/.test(r) || /^episodes\/[^/]+\.md$/.test(r)) docs[r] = parseDoc(p, t);
    }
    const readme = docs["README.md"] || parseDoc(dir + "README.md", "");
    const records = new Map(); const logs = [];
    for (const d of Object.values(docs)) { for (const r of d.records) records.set(r.id, r); logs.push(...d.logs); }
    const comm = (docs["comm-log.md"] || { logs: [] }).logs.map(e => ({ ...e, comm: true, dir: e.parts[0], ch: e.parts[1], who: e.parts[2], summary: e.parts.slice(3).join(" · ") }));
    const indexed = new Set(((byRel.get(dir + "archive/INDEX.md")) || "").split("\n").map(l => (l.match(/· (.+)$/) || [])[1]).filter(Boolean).map(s => s.trim()));
    const inbox = S.relNames.filter(p => p.startsWith(dir + "inbox/") && !p.endsWith("/.gitkeep")).map(p => p.slice(dir.length + 6)).filter(n => n && !n.includes("/") && !indexed.has(n));
    const episodes = Object.entries(docs).filter(([r]) => r.startsWith("episodes/")).map(([, d]) => d);
    const archivedEpisodes = S.relNames.filter(p => p.startsWith(dir + "archive/episodes/") && p.endsWith(".md"));
    const reviews = S.relNames.filter(p => p.startsWith(dir + "reviews/") && p.endsWith(".md")).sort().reverse();
    const fm = readme.fm || {};
    return {
      slug, dir, docs, readme, fm, records, logs, comm, inbox, episodes, archivedEpisodes, reviews,
      name: fm.name || slug, budget: +fm.reminder_budget || 7,
      window: +fm.coverage_window_days || 45, staleDays: +fm.stale_after_days || 60
    };
  }

  /* ---------- visibility & search ---------- */
  function visible(v) {
    v = v || "private";
    if (S.vis === "all") return true;
    if (S.vis === "team") return v === "team" || v === "crm";
    return v === "crm";
  }
  const filtered = () => S.vis !== "all";
  // A plain line with a tag block is judged by its tag; untagged content counts as private.
  function lineVis(l) { const m = String(l).match(/\{src: [^;{}]+; vis: (private|team|crm)\}\s*$/); return m ? m[1] : "private"; }
  const stripTag = l => String(l).replace(/\s*\{src: [^;{}]+; vis: (private|team|crm)\}\s*$/, "");
  const recs = (acc, type) => [...acc.records.values()].filter(r => (!type || r.type === type) && visible(r.keys.vis));
  const matchesQ = s => !S.q || (s || "").toLowerCase().includes(S.q.toLowerCase());

  /* ---------- analysis ---------- */
  function analyse(acc) {
    const t = S.today;
    const expired = recs(acc).filter(r => LEASED.has(r.type) && !EXEMPT.has(r.keys.status) && isDate(r.keys.review_by) && r.keys.review_by < t);
    const overdue = recs(acc, "A").filter(r => ["open", "waiting"].includes(r.keys.status) && isDate(r.keys.due) && r.keys.due < t && !expired.includes(r));
    const decisionsDue = recs(acc, "D").filter(r => r.keys.status === "active" && isDate(r.keys.revisit) && r.keys.revisit <= addDays(t, 14));
    const proposals = recs(acc, "P").filter(r => r.keys.status === "open");
    const people = recs(acc, "S");
    const high = people.filter(p => p.keys.influence === "high");
    const engaged = high.filter(p => isDate(p.keys.last_contact) && days(p.keys.last_contact, t) <= acc.window);
    const stale = ["account-plan.md", "value-proposition.md", "stakeholders.md"].filter(f => acc.docs[f] && isDate(acc.docs[f].fm.updated) && days(acc.docs[f].fm.updated, t) > acc.staleDays);
    const roles = ["decision-maker", "economic", "technical", "user", "coach", "gatekeeper"];
    const missingRoles = roles.filter(r => !people.some(p => p.keys.buying_role === r));
    const plan = acc.docs["account-plan.md"];

  function actions(acc) {

  function timeline(acc) {
    const all =acc.logs.map(e => ({ ...e, comm: e.file.endsWith("comm-log.md") })).filter(e => visible(e.vis));
    const files = [...new Set(all.map(e => fileName(e.file)))].sort();

  function value(acc) {

        h("div", { class: "small muted" }, `updated ${r.keys.last_update || "?"} · lease ${r.keys.review_by}${r.keys.review_by < t ? " (expired)" : ""}`), r.keys.risks && r.keys.risks !== "none known" ? h("div", { class: "small" }, "Risk: ", r.keys.risks) : null))) : h("p", { class: "muted" }, "None.")),
      h("div", { class: "card" }, h("h3", null, "News and signals"), news.length ? h("ul", { class: "plain" }, news.sort((a, b) => (b.keys.date || "").localeCompare(a.keys.date || "")).map(r => h("li", { style: "cursor:pointer", onclick: () => openRecord(r.id, acc) },
        pill(r.keys.relevance, r.keys.relevance === "high" ? "warn" : ""), " ", r.title, h("div", { class: "small muted" }, `${r.keys.date || ""} · ${r.keys.status}${r.keys.review_by < t && !EXEMPT.has(r.keys.status) ? " · lease expired" : ""}`), h("div", { class: "small" }, r.keys.implication || "")))) : h("p", { class: "muted" }, "None.")),
      h("div", { class: "card" }, h("h3", null, "Roadmap items relevant here"), rm.length ? h("ul", { class: "plain" }, rm.map(r => h("li", null, h("strong", null, r.title), " ", pill(r.keys.status), h("div", { class: "small muted" }, `${r.keys.product} · expected ${r.keys.expected || "?"}`), h("div", { class: "small" }, rich(r.keys.relevance || "", acc))))) : h("p", { class: "muted" }, "None.")));
  }

  function files(acc) {
    if (filtered()) return h("div", { class: "card" }, h("p", { class: "muted", style: "margin:0" }, "Raw files are hidden in presentation mode. Switch “Show” back to all entries."));
    const list = S.relNames.filter(p => p.startsWith(acc.dir) && !p.endsWith(".gitkeep")).sort();
    if (!S.filePath || !S.filePath.startsWith(acc.dir)) S.filePath = acc.dir + "README.md";

      h("div", { class: "card" }, h("p", { class: "mono muted", style: "margin-top:0" }, S.filePath), mdView(S.filePath)));

  function library() {
    const prod = new Set(S.shared.products.map(p => p.fm.id || fileName(p.path).replace(/\.md$/, "")));

      h("div", { class: "card", style: "margin-top:14px" }, h("table", null, h("thead", null, h("tr", null, ["Entry", "Status", "Challenge patterns", "Products", "Used at", "Updated", "Flags"].map(x => h("th", null, x)))),
        h("tbody", null, rows.map(({ v, fm, flags }) => h("tr", { class: "click", onclick: () => openVP(fm.id) },
          h("td", null, h("strong", null, fm.title || fm.id), h("div", { class: "mono muted" }, fm.id)), h("td", null, pill(fm.status)),
          h("td", { class: "small" }, (fm.challenge_patterns || []).join(" · ")), h("td", { class: "small" }, (fm.products || []).join(", ")),
          h("td", { class: "small" }, (fm.used_at || []).join(", ") || "—"), h("td", { class: "small nowrap" }, fm.updated, h("div", { class: "muted" }, ago(fm.updated))),

  function search() {
    const q = S.q.toLowerCase(); const out = h("div", null, h("h2", { class: "title" }, `Search: “${S.q}”`));
    for (const acc of S.accounts) {
      const rs = [...acc.records.values()].filter(r => visible(r.keys.vis) && (r.title + " " + Object.values(r.keys).join(" ")).toLowerCase().includes(q));

  /* ---------- loading ---------- */
  const MAX = 2_000_000;
  async function readDir(handle, prefix, out) {
    for await (const [name, child] of handle.entries()) {
      if (name === ".git" || name === "node_modules") continue;
      const path = prefix + name;
      if (child.kind === "directory") await readDir(child, path + "/", out);
      else {
        out.names.push(path);
        if (TEXT_EXT.test(name)) { const f = await child.getFile(); if (f.size <= MAX) out.files.set(path, await f.text()); }
      }
    }
  }
  async function openFolder() {
    if (window.showDirectoryPicker) {
      try { S.dir = await window.showDirectoryPicker({ mode: "read" }); await loadHandle(); return; }
      catch (e) { if (e && e.name === "AbortError") return; /* blocked by policy → fallback */ }
    }
    $("#picker").click();
  }
  async function loadHandle() {
    const out = { names: [], files: new Map() };
    await readDir(S.dir, S.dir.name + "/", out);

    $("#reload").hidden = false;

  async function fromPicker(fileList) {

      out.names.push(p);
      if (TEXT_EXT.test(f.name) && f.size <= MAX) out.files.set(p, await f.text());

    if (S.view.kind === "home" && S.accounts.length === 1) S.view = { kind: "account", slug: S.accounts[0].slug };
    render();
  }
  /** For tests and scripted use: loadFromList([{path, text}]) */

  }

  /* ---------- wiring ---------- */
  function init() {
    $("#today").value = S.today;

    $("#q").addEventListener("input", e => { S.q = e.target.value.trim(); if (S.q && S.view.kind === "home") S.view = { kind: "search" }; if (!S.q && S.view.kind === "search") S.view = { kind: "home" }; render(); });
    $("#q").addEventListener("keydown", e => { if (e.key === "Enter" && S.q) { S.view = { kind: "search" }; render(); } });
    $("#open").addEventListener("click", openFolder);
    $("#reload").addEventListener("click", () => S.dir && loadHandle());
    $("#picker").addEventListener("change", e => fromPicker(e.target.files));
    $("#dclose").addEventListener("click", closeDrawer);

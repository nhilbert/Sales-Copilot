# Builds the downloads end users need (no Python or git on their side)
# and attaches them to a GitHub release.
name: release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lint the demo workspace
        run: python3 tools/lint.py examples/demo-workspace/accounts --today 2026-10-30 --quiet
      - name: Build release zips
        run: python3 tools/desk.py release --out dist
      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: sales-copilot-downloads
          path: |
            dist/*.zip
            dist/skills/*.zip
      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/*.zip dist/skills/*.zip --clobber
